[project]
name = "mirrordash-cli"
version = "0.1.0"
description = "Developer CLI and tools for bootstrapping MirrorDash modules"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mirrordash-cli = "mirrordash_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_sdk"]
