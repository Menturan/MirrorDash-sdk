[project]
name = "mirrordash-sdk"
version = "0.6.0"
description = "Create and try MirrorDash modules"
readme = "README.md"
license = "MIT AND MIT-0"  # MIT-0: the module template, so a module made with it is its author's
license-files = ["LICENSE", "mirrordash_sdk/templates/LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "click>=8.0.0"
]

[project.urls]
Homepage = "https://github.com/Menturan/mirrordash-sdk"
Repository = "https://github.com/Menturan/mirrordash-sdk"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14.0"
]

[project.scripts]
mirrordash-sdk = "mirrordash_sdk.cli:main"
# The old name, kept so existing instructions keep working
mirrordash-cli = "mirrordash_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_sdk"]

[tool.pytest.ini_options]
# mirrordash_sdk/templates holds the tests of generated modules; they only run inside a generated module
testpaths = ["tests"]
