<!-- Built from the component library at http://localhost:8000/design, so no CSS is needed -->
<div class="flex-column">
    {% if show_header %}
    <h2 class="module-header">{{ translations.get("title", "$title") }}</h2>
    {% endif %}
    <div class="data-list">
        <div class="data-list__item">
            <span class="data-list__label">{{ translations.get("last_checked", "Last checked") }}</span>
            <span class="data-list__value">{{ current_time }}</span>
        </div>
    </div>
</div>
