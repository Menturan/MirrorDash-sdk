[project]
name = "$folder_name"
version = "0.1.0"
description = "$description"
requires-python = ">=3.14"
authors = [
    { name = "$author" }
]
# The mirror provides the rest (rendering, fetch_json/fetch, translations); add only what plugin.py imports
dependencies = []

[project.entry-points."mirrordash.modules"]
$package_name = "$package_name.plugin:$class_name"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["$package_name"]
