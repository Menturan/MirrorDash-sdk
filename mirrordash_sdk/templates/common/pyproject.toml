[project]
name = "$folder_name"
version = "0.1.0"
description = "$description"
requires-python = ">=3.14"
license = "MIT"  # LICENSE: yours to change; the template it came from asks nothing (MIT-0)
license-files = ["LICENSE"]
authors = [
    { name = "$author" }
]
# The mirror provides the rest (rendering, fetch_json/fetch, translations, fastapi); add only what else
# plugin.py imports
dependencies = []

[project.entry-points."mirrordash.modules"]
$package_name = "$package_name.plugin:$class_name"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.115",  # the mirror's, for the tests of a module with its own web address
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["$package_name"]
