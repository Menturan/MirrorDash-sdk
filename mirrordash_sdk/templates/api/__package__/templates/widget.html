<!-- Built from the component library at http://localhost:8000/design, so no CSS is needed -->
<div class="flex-column">
    {% if show_header %}
    <h2 class="module-header">{{ translations.get("title", "$title") }}</h2>
    {% endif %}
    {% if data %}
    <span class="display-lg">{{ data.value }}</span>
    <div class="data-list">
        {% for label, value in data.rows %}
        <div class="data-list__item">
            <span class="data-list__label">{{ label }}</span>
            <span class="data-list__value">{{ value }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% if message %}
    <div class="module-message"><i data-lucide="{{ icon }}"></i><span>{{ message }}</span></div>
    {% endif %}
</div>
